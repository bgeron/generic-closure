[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "generic-closure"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
description = "Generic closures emulated using a trait and a macro"
documentation = "https://docs.rs/generic-closure"
repository = "https://github.com/bgeron/generic-closure"
readme = "README.md"
exclude = ["/.cargo", "/xtask"]
keywords = ["closure", "generics", "polymorphism"]
categories = ["rust-patterns", "no-std"]

[dependencies]
either = { version = "1.17.0", optional = true, default-features = false }

[features]
default = ["alloc", "either"]
alloc = []
either = ["dep:either"]

[dev-dependencies]
trybuild = "1.0.119"

[package.metadata.docs.rs]
all-features = true
